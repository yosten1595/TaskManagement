spring.application.name=taskboard-api

# 開発サーバーのポートは固定（フロントエンドの Vite が /api をここへ転送する）
server.port=8080

# PostgreSQL (docker-compose.yml の db サービスに対応。環境変数で上書き可能)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/taskboard}
spring.datasource.username=${DB_USERNAME:taskboard}
spring.datasource.password=${DB_PASSWORD:taskboard}

# スキーマは Flyway（src/main/resources/db/migration）だけが変更する。エンティティとずれていたら起動時に失敗する
spring.jpa.hibernate.ddl-auto=validate
# ddl-auto=update で作られた既存の DB は、バージョン 1（V1 と同じスキーマ）として引き継ぐ。空の DB には V1 から適用する
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false
# 遅延ロードの N+1 を緩和する
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# 動作確認用テストデータ（boards が空のときだけ投入）。本番では SEED_ENABLED=false にする
app.seed.enabled=${SEED_ENABLED:true}

# /actuator/health で DB 接続状態を確認できるようにする
management.endpoint.health.show-details=always
