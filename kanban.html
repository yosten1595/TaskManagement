<title>タスクボード</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Inter:wght@400;500;600&display=swap">

<style>
  /* ── トークン定義 ── */
  :root {
    --bg:        #f0f2f5;
    --surface:   #ffffff;
    --surface2:  #eef0f4;
    --border:    #dde1e9;
    --fg:        #1a1d23;
    --fg-muted:  #6b7280;
    --accent:    #3b63f7;
    --accent-bg: #eef1fe;
    --col-todo:  #e8ecff;
    --col-doing: #fff4e0;
    --col-done:  #e3f9ee;
    --col-todo-hd:  #3b63f7;
    --col-doing-hd: #e08a00;
    --col-done-hd:  #179c5b;
    --danger:    #e53e3e;
    --shadow:    0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.06);
    --shadow-drag: 0 8px 24px rgba(0,0,0,.18);
    --radius:    10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:        #12141a;
      --surface:   #1d2030;
      --surface2:  #252840;
      --border:    #2e3250;
      --fg:        #e8eaf2;
      --fg-muted:  #8b93b0;
      --accent:    #6282ff;
      --accent-bg: #1e2445;
      --col-todo:  #1e2445;
      --col-doing: #2a2010;
      --col-done:  #0f2620;
      --col-todo-hd:  #6282ff;
      --col-doing-hd: #f0a832;
      --col-done-hd:  #29c778;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:        #12141a;
    --surface:   #1d2030;
    --surface2:  #252840;
    --border:    #2e3250;
    --fg:        #e8eaf2;
    --fg-muted:  #8b93b0;
    --accent:    #6282ff;
    --accent-bg: #1e2445;
    --col-todo:  #1e2445;
    --col-doing: #2a2010;
    --col-done:  #0f2620;
    --col-todo-hd:  #6282ff;
    --col-doing-hd: #f0a832;
    --col-done-hd:  #29c778;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100%;
    display: flex;
    flex-direction: column;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
  }

  /* ── ヘッダー ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 max(20px, env(safe-area-inset-left, 0px));
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 10;
  }
  .logo {
    font-weight: 700;
    font-size: 1.1rem;
    letter-spacing: -.02em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo-icon {
    width: 28px; height: 28px;
    background: var(--accent);
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
  }
  .logo-icon svg { fill: #fff; }

  .header-actions { display: flex; gap: 8px; }
  .btn-icon {
    background: none; border: none; cursor: pointer;
    color: var(--fg-muted);
    width: 34px; height: 34px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s;
  }
  .btn-icon:hover { background: var(--surface2); color: var(--fg); }
  .btn-icon:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ── ボードエリア ── */
  .board-wrap {
    flex: 1;
    overflow-x: auto;
    padding: 24px max(16px, env(safe-area-inset-right, 0px));
  }
  .board {
    display: flex;
    gap: 16px;
    min-height: calc(100vh - 56px - 48px);
    align-items: flex-start;
  }

  /* ── 列 ── */
  .column {
    flex: 0 0 300px;
    width: 300px;
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 56px - 48px);
  }
  .col-header {
    padding: 14px 14px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 2px solid var(--border);
    flex-shrink: 0;
  }
  .col-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .col-title {
    font-weight: 700;
    font-size: .9rem;
    flex: 1;
  }
  .col-count {
    font-size: .78rem;
    font-weight: 500;
    background: var(--surface2);
    color: var(--fg-muted);
    border-radius: 20px;
    padding: 1px 8px;
    font-variant-numeric: tabular-nums;
  }

  /* ── カードリスト ── */
  .card-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px 10px 6px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 48px;
  }
  .card-list.drag-over { background: var(--accent-bg); border-radius: 6px; }

  /* ── カード ── */
  .card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    cursor: grab;
    display: flex;
    flex-direction: column;
    gap: 4px;
    transition: box-shadow .15s, transform .15s;
    position: relative;
  }
  .card:active { cursor: grabbing; }
  .card.dragging {
    opacity: .45;
    box-shadow: var(--shadow-drag);
  }
  .card-text {
    flex: 1;
    font-size: .88rem;
    line-height: 1.5;
    word-break: break-word;
    min-width: 0;
  }
  .card-text[contenteditable="true"] {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
    padding: 0 2px;
  }
  .card-del {
    background: none; border: none; cursor: pointer;
    color: var(--fg-muted);
    padding: 2px; border-radius: 4px;
    opacity: 0; flex-shrink: 0;
    transition: opacity .15s, color .15s;
    line-height: 1;
  }
  .card:hover .card-del { opacity: 1; }
  .card-del:hover { color: var(--danger); }
  .card-del:focus-visible { outline: 2px solid var(--accent); opacity: 1; }
  .card-top { display: flex; align-items: flex-start; gap: 8px; }
  .card-date {
    font-size: .76rem; font-weight: 500;
    padding: 2px 8px 2px 6px;
    border-radius: 20px;
    display: inline-flex; align-items: center; gap: 4px;
    width: fit-content;
    font-variant-numeric: tabular-nums;
    border: 1px solid transparent;
  }
  .card-date.date-ok   { background: var(--surface); color: var(--fg-muted); border-color: var(--border); }
  .card-date.date-soon { background: #fff8e1; color: #7c4a00; border-color: #fcd98a; }
  .card-date.date-due  { background: #fff3cd; color: #7c4a00; border-color: #f9bc2c; font-weight: 700; }
  .card-date.date-over { background: #fde8e8; color: #b91c1c; border-color: #fca5a5; }
  :root[data-theme="dark"] .card-date.date-soon,
  :root[data-theme="dark"] .card-date.date-due  { background: #2d2000; color: #f0c060; border-color: #6b4a00; }
  :root[data-theme="dark"] .card-date.date-over { background: #2d0f0f; color: #f87171; border-color: #7f1d1d; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .card-date.date-soon,
    :root:not([data-theme="light"]) .card-date.date-due  { background: #2d2000; color: #f0c060; border-color: #6b4a00; }
    :root:not([data-theme="light"]) .card-date.date-over { background: #2d0f0f; color: #f87171; border-color: #7f1d1d; }
  }
  .date-label { font-size: .8rem; color: var(--fg-muted); margin-bottom: 3px; }
  .date-input {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px;
    color: var(--fg); font-size: .84rem; font-family: inherit;
    transition: border-color .15s; cursor: pointer; width: 100%;
  }
  .date-input:focus { outline: none; border-color: var(--accent); }

  /* ── 追加ボタン ── */
  .add-area { padding: 6px 10px 10px; flex-shrink: 0; }
  .add-form { display: none; flex-direction: column; gap: 6px; }
  .add-form.open { display: flex; }
  .add-input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    color: var(--fg);
    font-size: .88rem;
    font-family: inherit;
    resize: none;
    line-height: 1.5;
    transition: border-color .15s;
  }
  .add-input:focus { outline: none; border-color: var(--accent); }
  .add-actions { display: flex; gap: 6px; }
  .btn-add-confirm {
    background: var(--accent);
    color: #fff;
    border: none; cursor: pointer;
    padding: 6px 14px;
    border-radius: 7px;
    font-size: .84rem; font-weight: 600;
    font-family: inherit;
    transition: opacity .15s;
  }
  .btn-add-confirm:hover { opacity: .88; }
  .btn-add-confirm:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-cancel {
    background: none; border: none; cursor: pointer;
    color: var(--fg-muted);
    padding: 6px 10px;
    border-radius: 7px;
    font-size: .84rem;
    font-family: inherit;
    transition: background .15s;
  }
  .btn-cancel:hover { background: var(--surface2); color: var(--fg); }
  .btn-add-card {
    width: 100%;
    background: none; border: none; cursor: pointer;
    color: var(--fg-muted);
    padding: 7px 4px;
    border-radius: 7px;
    font-size: .85rem;
    font-family: inherit;
    text-align: left;
    display: flex; align-items: center; gap: 6px;
    transition: background .15s, color .15s;
  }
  .btn-add-card:hover { background: var(--surface2); color: var(--fg); }
  .btn-add-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (max-width: 680px) {
    .board { flex-direction: column; align-items: stretch; }
    .column { flex: none; width: 100%; max-height: none; }
    .board-wrap { overflow-x: hidden; }
  }

  @media (prefers-reduced-motion: reduce) {
    .card, .btn-add-confirm, .btn-add-card { transition: none; }
  }
</style>

<header>
  <div class="logo">
    <div class="logo-icon">
      <svg width="16" height="16" viewBox="0 0 16 16"><rect x="1" y="1" width="5" height="10" rx="1.5"/><rect x="9" y="1" width="5" height="7" rx="1.5"/></svg>
    </div>
    タスクボード
  </div>
  <div class="header-actions">
    <button class="btn-icon" id="themeToggle" aria-label="テーマ切替" title="テーマ切替">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
  </div>
</header>

<div class="board-wrap">
  <div class="board" id="board"></div>
</div>

<script>
const COLUMNS = [
  { id: 'todo',  label: 'TODO',  color: 'var(--col-todo-hd)',  bg: 'var(--col-todo)' },
  { id: 'doing', label: '進行中', color: 'var(--col-doing-hd)', bg: 'var(--col-doing)' },
  { id: 'done',  label: '完了',  color: 'var(--col-done-hd)',  bg: 'var(--col-done)' },
];

const DEFAULTS = {
  todo:  ['ログイン画面のデザイン', 'APIエンドポイントの設計', 'テスト計画を立てる'],
  doing: ['データベースの設計書作成'],
  done:  ['要件定義', '環境セットアップ'],
};

function loadData() {
  try {
    const raw = localStorage.getItem('kanban_v1');
    if (raw) return JSON.parse(raw);
  } catch {}
  const init = {};
  COLUMNS.forEach(c => {
    init[c.id] = (DEFAULTS[c.id] || []).map(text => ({ id: uid(), text }));
  });
  return init;
}

function saveData(data) {
  try { localStorage.setItem('kanban_v1', JSON.stringify(data)); } catch {}
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

let data = loadData();
let dragId = null, dragFrom = null;

function render() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  COLUMNS.forEach(col => {
    const cards = data[col.id] || [];
    const el = document.createElement('div');
    el.className = 'column';
    el.innerHTML = `
      <div class="col-header" style="border-bottom-color:${col.color}20">
        <div class="col-dot" style="background:${col.color}"></div>
        <span class="col-title" style="color:${col.color}">${col.label}</span>
        <span class="col-count">${cards.length}</span>
      </div>
      <div class="card-list" id="list-${col.id}" data-col="${col.id}"></div>
      <div class="add-area">
        <div class="add-form" id="form-${col.id}">
          <textarea class="add-input" id="input-${col.id}" rows="2" placeholder="カードのタイトルを入力…"></textarea>
          <div>
            <div class="date-label">期限日（任意）</div>
            <input type="date" class="date-input" id="date-${col.id}">
          </div>
          <div class="add-actions">
            <button class="btn-add-confirm" data-col="${col.id}">追加</button>
            <button class="btn-cancel" data-col="${col.id}">キャンセル</button>
          </div>
        </div>
        <button class="btn-add-card" id="btn-open-${col.id}" data-col="${col.id}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          カードを追加
        </button>
      </div>
    `;
    board.appendChild(el);

    const list = el.querySelector(`#list-${col.id}`);
    cards.forEach(card => {
      const c = document.createElement('div');
      c.className = 'card';
      c.draggable = true;
      c.dataset.id = card.id;
      c.dataset.col = col.id;
      const dateBadge = card.dueDate ? `<div class="${dateBadgeClass(card.dueDate)}">${dateIcon()}${formatDate(card.dueDate)}</div>` : '';
      c.innerHTML = `
        <div class="card-top">
          <div class="card-text" contenteditable="false">${escHtml(card.text)}</div>
          <button class="card-del" data-id="${card.id}" data-col="${col.id}" title="削除" aria-label="削除">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        ${dateBadge}
      `;
      // ダブルクリックで編集
      const textEl = c.querySelector('.card-top .card-text');
      textEl.addEventListener('dblclick', () => {
        textEl.contentEditable = 'true';
        textEl.focus();
        c.draggable = false;
        const sel = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(textEl);
        range.collapse(false);
        sel.removeAllRanges();
        sel.addRange(range);
      });
      textEl.addEventListener('blur', () => {
        textEl.contentEditable = 'false';
        c.draggable = true;
        const newText = textEl.textContent.trim();
        if (newText) {
          const idx = data[col.id].findIndex(x => x.id === card.id);
          if (idx !== -1) { data[col.id][idx].text = newText; saveData(data); }
        } else {
          render();
        }
      });
      textEl.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); textEl.blur(); }
        if (e.key === 'Escape') { textEl.textContent = escHtml(card.text); textEl.blur(); }
      });
      // ドラッグ
      c.addEventListener('dragstart', e => {
        dragId = card.id; dragFrom = col.id;
        setTimeout(() => c.classList.add('dragging'), 0);
        e.dataTransfer.effectAllowed = 'move';
      });
      c.addEventListener('dragend', () => {
        c.classList.remove('dragging');
        document.querySelectorAll('.card-list').forEach(l => l.classList.remove('drag-over'));
      });
      list.appendChild(c);
    });

    // ドロップゾーン
    list.addEventListener('dragover', e => { e.preventDefault(); list.classList.add('drag-over'); });
    list.addEventListener('dragleave', () => list.classList.remove('drag-over'));
    list.addEventListener('drop', e => {
      e.preventDefault();
      list.classList.remove('drag-over');
      if (!dragId || dragFrom === col.id) return;
      const srcIdx = data[dragFrom].findIndex(x => x.id === dragId);
      if (srcIdx === -1) return;
      const [moved] = data[dragFrom].splice(srcIdx, 1);
      data[col.id].push(moved);
      saveData(data);
      render();
    });
  });

  // フォームイベント
  COLUMNS.forEach(col => {
    document.getElementById(`btn-open-${col.id}`).addEventListener('click', () => openForm(col.id));
    document.querySelector(`.btn-add-confirm[data-col="${col.id}"]`).addEventListener('click', () => addCard(col.id));
    document.querySelector(`.btn-cancel[data-col="${col.id}"]`).addEventListener('click', () => closeForm(col.id));
    document.getElementById(`input-${col.id}`).addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addCard(col.id); }
      if (e.key === 'Escape') closeForm(col.id);
    });
  });

  // 削除ボタン
  document.querySelectorAll('.card-del').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const { id, col } = btn.dataset;
      data[col] = data[col].filter(x => x.id !== id);
      saveData(data); render();
    });
  });
}

function openForm(colId) {
  document.getElementById(`form-${colId}`).classList.add('open');
  document.getElementById(`btn-open-${colId}`).hidden = true;
  document.getElementById(`input-${colId}`).focus();
}

function closeForm(colId) {
  document.getElementById(`form-${colId}`).classList.remove('open');
  document.getElementById(`input-${colId}`).value = '';
  const di = document.getElementById(`date-${colId}`);
  if (di) di.value = '';
  document.getElementById(`btn-open-${colId}`).hidden = false;
}

function addCard(colId) {
  const input = document.getElementById(`input-${colId}`);
  const dateEl = document.getElementById(`date-${colId}`);
  const text = input.value.trim();
  if (!text) return;
  data[colId].push({ id: uid(), text, dueDate: dateEl ? dateEl.value : '' });
  saveData(data);
  render();
  openForm(colId);
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDate(iso) {
  if (!iso) return '';
  const [, m, d] = iso.split('-');
  return `${parseInt(m)}月${parseInt(d)}日`;
}

function dateBadgeClass(iso) {
  if (!iso) return 'card-date date-ok';
  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(iso); due.setHours(0,0,0,0);
  const diff = (due - today) / 86400000;
  if (diff < 0)   return 'card-date date-over';
  if (diff === 0) return 'card-date date-due';
  if (diff <= 3)  return 'card-date date-soon';
  return 'card-date date-ok';
}

function dateIcon() {
  return `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`;
}

// テーマ切替
const themeBtn = document.getElementById('themeToggle');
function getTheme() { try { return localStorage.getItem('kanban_theme') || 'system'; } catch { return 'system'; } }
function applyTheme(t) {
  if (t === 'dark') document.documentElement.dataset.theme = 'dark';
  else if (t === 'light') document.documentElement.dataset.theme = 'light';
  else delete document.documentElement.dataset.theme;
}
themeBtn.addEventListener('click', () => {
  const cur = getTheme();
  const next = cur === 'system' ? 'dark' : cur === 'dark' ? 'light' : 'system';
  try { localStorage.setItem('kanban_theme', next); } catch {}
  applyTheme(next);
});
applyTheme(getTheme());

render();
</script>
