name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (check)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_DB: taskboard
          POSTGRES_USER: taskboard
          POSTGRES_PASSWORD: taskboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskboard -d taskboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI の DB はホスト側ポート 5432 で受ける（ローカルの docker-compose は 5433）
      DB_URL: jdbc:postgresql://localhost:5432/taskboard
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      # テスト + Checkstyle（コンパイラ警告は警告 0 を要求）
      - run: ./gradlew check --console=plain

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # tsc -b（型チェック）と vite build
      - run: npm run build
